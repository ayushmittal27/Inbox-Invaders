<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Inbox Invaders — Cyber-Clean Protocol</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0e14; color: #00ffcc; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        #game-container { position: relative; width: 800px; height: 600px; border: 2px solid #00ffcc; box-shadow: 0 0 20px rgba(0, 255, 204, 0.3); background: #05070a; }
        canvas { width: 100%; height: 100%; display: block; }
        #ui-overlay { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; font-weight: bold; text-shadow: 0 0 5px #00ffcc; }
        #terminal-log { position: absolute; bottom: 10px; left: 10px; right: 10px; height: 80px; background: rgba(5, 7, 10, 0.85); border: 1px solid #00ffcc; padding: 5px 10px; font-size: 12px; overflow-y: auto; color: #33ff55; font-family: monospace; }
        .controls-hint { margin-top: 10px; color: #a0aab5; font-size: 13px; text-align: center; }
        .highlight { color: #ff0055; font-weight: bold; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-overlay">
            <div>EMAILS DELETED: <span id="score">0</span></div>
            <div>INBOX CLEANED: <span id="percent">0%</span></div>
            <div>SHIELD: <span id="shield">100%</span></div>
        </div>
        <canvas id="canvas"></canvas>
        <div id="terminal-log">
            [SYS_INIT] Inbox Invaders Engine Ready...<br>
            [CONNECT] Connected to Simulated Gmail Worker Queue v1.0<br>
        </div>
    </div>

    <div class="controls-hint">
        <b>Controls:</b> Move: Mouse / Arrows | <span class="highlight">SPACE/Click</span>: Delete Spam | <span class="highlight">A Key</span>: Archive | <span class="highlight">S Key</span>: Star VIP | <span class="highlight">E Key</span>: EMP Bomb
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 800;
        canvas.height = 600;

        let score = 0;
        let totalEmails = 50;
        let cleaned = 0;
        let shield = 100;

        const logEl = document.getElementById('terminal-log');
        function addLog(msg) {
            const line = document.createElement('div');
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logEl.appendChild(line);
            logEl.scrollTop = logEl.scrollHeight;
        }

        class Player {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height - 50;
                this.size = 20;
            }
            draw() {
                ctx.fillStyle = '#00ffcc';
                ctx.beginPath();
                ctx.moveTo(this.x, this.y - this.size);
                ctx.lineTo(this.x - this.size, this.y + this.size);
                ctx.lineTo(this.x + this.size, this.y + this.size);
                ctx.fill();
            }
        }

        class EmailEnemy {
            constructor() {
                this.x = Math.random() * (canvas.width - 120) + 20;
                this.y = -40;
                this.speed = Math.random() * 1.5 + 1;
                const types = [
                    { label: 'SPAM: 90% OFF!', color: '#ff0055', action: 'DELETE' },
                    { label: 'Newsletter #402', color: '#ffcc00', action: 'ARCHIVE' },
                    { label: 'Receipt: Uber', color: '#00ccff', action: 'ARCHIVE' },
                    { label: 'URGENT: Boss Email', color: '#ff00ff', action: 'STAR' }
                ];
                this.type = types[Math.floor(Math.random() * types.length)];
            }
            update() { this.y += this.speed; }
            draw() {
                ctx.strokeStyle = this.type.color;
                ctx.fillStyle = '#0f172a';
                ctx.lineWidth = 2;
                ctx.fillRect(this.x, this.y, 130, 30);
                ctx.strokeRect(this.x, this.y, 130, 30);
                ctx.fillStyle = '#ffffff';
                ctx.font = '10px monospace';
                ctx.fillText(this.type.label, this.x + 5, this.y + 18);
            }
        }

        const player = new Player();
        const enemies = [];
        let spawnTimer = 0;

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            player.x = e.clientX - rect.left;
        });

            for (let i = enemies.length - 1; i >= 0; i--) {
